version: 2
models:
  - name: customer_cleansed
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - not_null
  - name: order_cleansed
    columns:
      - name: customer_id
        tests:
          - relationships:
             arguments:
              field: customer_id
              to: source('raw','customers')
      